# Install as a root-owned Apache configuration, not an .htaccess file.
<Directory "/var/www/html/deltabotvps">
    <FilesMatch "(?i)(^\.|\.bak[0-9]*$|\.sqlite3(?:-wal|-shm)?$|\.pem$|\.key$|\.p12$|\.jks$|\.sql$|^baseInfo(?:\.sample)?\.php$|^config\.php$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory "/var/www/html/deltabotvps/.git">
    Require all denied
</Directory>
<Directory "/var/www/html/deltabotvps/vpsbot">
    Require all denied
</Directory>
<Directory "/var/www/html/deltabotvps/tests">
    Require all denied
</Directory>
<Directory "/var/www/html/deltabotvps/settings/npv_public_keys">
    Require all denied
</Directory>
<Directory "/var/www/html/deltabotvps/settings/npv_devices">
    Require all denied
</Directory>
