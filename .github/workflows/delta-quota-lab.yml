name: Delta quota gateway lab
on:
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/delta-quota-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s gateway -p 'test_*.py'
      - name: Validate nft syntax in an isolated network namespace
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 iputils-ping
          sudo unshare -n bash gateway/test_network_gate.sh
