name: Apply strict charity v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-charity-v4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch charity module
        run: python3 .github/patch_charity_v4.py
      - name: Validate PHP
        run: |
          php -l charity_campaign.php
          php -l config.php
          php -l bot.php
          grep -q "CHARITY_CONTROL_VERSION','4" charity_campaign.php
          grep -q "charityExtractPremiumTextEntities" charity_campaign.php
      - name: Commit v4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charity_campaign.php
          git commit -m 'Harden charity card-only collection and premium emoji support'
          git push
