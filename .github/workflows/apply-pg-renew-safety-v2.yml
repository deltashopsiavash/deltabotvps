name: Apply PasarGuard renewal safety v2
on:
  push:
    paths:
      - '.github/workflows/apply-pg-renew-safety-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch renewal safety
        shell: bash
        run: |
          python3 .github/patch_pg_renew_safety_v2.py
          php -l config.php
          php -l bot.php
          php -l pay/back.php
          grep -q "Current official API" config.php
          grep -q "این رسید قبلاً پردازش شده است" bot.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.php bot.php
          git commit -m "Harden PasarGuard renewal processing"
          git push