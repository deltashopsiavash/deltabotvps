name: PHP Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - feature/usdt-tracking-autoapprove

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint changed PHP files
        run: |
          php -l bot.php
          php -l admin_service_manager.php
          php -l service_subscription_ui.php
          php -l reseller_finalize_worker.php
          php -l settings/warnusers.php
          php -l settings/expired_subscriptions_admin.php
          php -l config.php
          php -l delta_order_features.php
          php -l settings/rewardReport.php
          php -l tests/order_features.php
          php tests/order_features.php
          php tests/admin_service_manager.php
          php tests/service_subscription_rules.php
          bash -n update.sh
      - name: Test NPVS v6 public-key generator
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=41,<47'
          python3 tests/test_npvs_public_key.py
