name: PHP Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - feature/usdt-tracking-autoapprove

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint changed PHP files
        run: |
          php -l bot.php
          php -l config.php
          php -l delta_order_features.php
          php -l settings/rewardReport.php
