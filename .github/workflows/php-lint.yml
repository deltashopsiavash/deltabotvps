name: PHP Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - main
      - feature/usdt-tracking-autoapprove

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Lint changed PHP files
        run: |
          php -l bot.php
          php -l phone_registration.php
          php -l payment_card_rotation.php
          php -l black_friday.php
          php -l black_friday_ui.php
          php -l black_friday_storefront.php
          php -l financial_reports.php
          php -l tests/financial_reports.php
          php -l pay/index.php
          php -l tests/black_friday.php
          php -l tests/payment_card_rotation.php
          php -l tests/phone_registration.php
          php -l admin_service_manager.php
          php -l service_subscription_ui.php
          php -l reseller_webhook.php
          php -l reseller_finalize_worker.php
          php -l settings/warnusers.php
          php -l settings/expired_subscriptions_admin.php
          php -l config.php
          php -l delta_order_features.php
          php -l settings/rewardReport.php
          php -l tests/order_features.php
          php tests/order_features.php
          php tests/admin_service_manager.php
          php tests/phone_registration.php
          php tests/payment_card_rotation.php
          php tests/black_friday.php
          php tests/financial_reports.php
          php tests/service_subscription_rules.php
          php tests/service_ui_gradient.php
          php tests/reseller_webhook.php
          bash -n update.sh
      - name: Test NPVS v6 public-key generator
        run: |
          python3 -m pip install --disable-pip-version-check 'cryptography>=41,<47'
          python3 tests/test_npvs_public_key.py

  black-friday-collation:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_DATABASE: delta_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP + MySQL client
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none
      - name: Verify Black Friday joins across MySQL collations
        env:
          DELTA_CI_MYSQL_HOST: 127.0.0.1
          DELTA_CI_MYSQL_PORT: '3306'
          DELTA_CI_MYSQL_USER: root
          DELTA_CI_MYSQL_PASSWORD: ci_test_password
          DELTA_CI_MYSQL_DB: delta_ci
        run: |
          php -l tests/black_friday_collation_mysql.php
          php tests/black_friday_collation_mysql.php
          php -l tests/black_friday_storefront_mysql.php
          php tests/black_friday_storefront_mysql.php
