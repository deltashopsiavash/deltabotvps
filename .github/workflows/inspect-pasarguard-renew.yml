name: Inspect Pasarguard renewal
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-pasarguard-renew.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect renewal flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bot.php')
          s=p.read_text(encoding='utf-8',errors='replace').splitlines()
          terms=['PG_RENEW_FULL','pgRenew','تمدید کلی','ظرفیت این سرور پر شده','approveRenewAcc','RENEW_FULL','pasarguard','PasarGuard','pg_renew']
          hits=[]
          for i,line in enumerate(s,1):
              if any(t.lower() in line.lower() for t in terms):
                  hits.append(i)
          merged=[]
          for i in hits:
              a=max(1,i-14); b=min(len(s),i+24)
              if merged and a<=merged[-1][1]+2: merged[-1][1]=max(merged[-1][1],b)
              else: merged.append([a,b])
          print('TOTAL_LINES',len(s),'HITS',len(hits),'RANGES',merged)
          for a,b in merged:
              print(f'\n===== LINES {a}-{b} =====')
              for n in range(a,b+1):
                  print(f'{n}: {s[n-1]}')
          PY