name: Display charity dates in Iranian calendar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iranian-charity-dates.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Iranian dates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('charity_campaign.php')
          s = p.read_text(encoding='utf-8')
          marker = "if (!function_exists('charityTemplateMap')) {"
          if marker not in s:
              raise SystemExit('charityTemplateMap marker not found')
          helpers = "if (!function_exists('charityGregorianToJalali')) {\n    function charityGregorianToJalali($gy,$gm,$gd){\n        $gdm=[0,31,59,90,120,151,181,212,243,273,304,334];\n        $gy2=$gm>2?$gy+1:$gy;\n        $days=355666+(365*$gy)+intdiv($gy2+3,4)-intdiv($gy2+99,100)+intdiv($gy2+399,400)+$gd+$gdm[$gm-1];\n        $jy=-1595+33*intdiv($days,12053);$days%=12053;\n        $jy+=4*intdiv($days,1461);$days%=1461;\n        if($days>365){$jy+=intdiv($days-1,365);$days=($days-1)%365;}\n        if($days<186){$jm=1+intdiv($days,31);$jd=1+($days%31);}else{$jm=7+intdiv($days-186,30);$jd=1+(($days-186)%30);}\n        return [$jy,$jm,$jd];\n    }\n}\nif (!function_exists('charityPersianDigits')) {\n    function charityPersianDigits($v){return strtr((string)$v,['0'=>'۰','1'=>'۱','2'=>'۲','3'=>'۳','4'=>'۴','5'=>'۵','6'=>'۶','7'=>'۷','8'=>'۸','9'=>'۹']);}\n}\nif (!function_exists('charityIranDate')) {\n    function charityIranDate($timestamp){\n        $timestamp=(int)$timestamp;if($timestamp<=0)return '-';\n        try{$dt=(new DateTimeImmutable('@'.$timestamp))->setTimezone(new DateTimeZone('Asia/Tehran'));}catch(Throwable $e){return '-';}\n        [$jy,$jm,$jd]=charityGregorianToJalali((int)$dt->format('Y'),(int)$dt->format('n'),(int)$dt->format('j'));\n        return charityPersianDigits(sprintf('%04d/%02d/%02d - %02d:%02d',$jy,$jm,$jd,(int)$dt->format('H'),(int)$dt->format('i')));\n    }\n}\n"
          if "function charityIranDate(" not in s:
              s = s.replace(marker, helpers + marker, 1)
          s = s.replace("$c?date('Y-m-d H:i',(int)$c['starts_at']):'-'", "$c?charityIranDate((int)$c['starts_at']):'-'")
          s = s.replace("$c?date('Y-m-d H:i',(int)$c['ends_at']):'-'", "$c?charityIranDate((int)$c['ends_at']):'-'")
          p.write_text(s, encoding='utf-8')
          PY
          php -l charity_campaign.php
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charity_campaign.php
          git commit -m "Use Jalali dates and Tehran time for charity campaign"
          git push
