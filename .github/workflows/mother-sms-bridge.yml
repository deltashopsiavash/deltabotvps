name: Mother-only SMS Bridge installer safety

on:
  push:
    paths:
      - delta.sh
      - update.sh
      - scripts/install-mother-sms-bridge.sh
      - .github/workflows/mother-sms-bridge.yml
  workflow_dispatch:

jobs:
  installer-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing mother install and update script syntax
        run: |
          bash -n delta.sh
          bash -n update.sh
      - name: Validate dedicated mother-only bridge bootstrap
        run: |
          bash -n scripts/install-mother-sms-bridge.sh
          grep -Fq -- 'MOTHER_ROOT="/var/www/html/deltabotvps"' scripts/install-mother-sms-bridge.sh
          grep -Fq -- 'MOTHER_CONFIG="$MOTHER_ROOT/baseInfo.php"' scripts/install-mother-sms-bridge.sh
          grep -Fq -- '"--mother-only"' scripts/install-mother-sms-bridge.sh || grep -Fq -- '--mother-only --domain' scripts/install-mother-sms-bridge.sh
          grep -Fq -- '"/deltabotvps/"' scripts/install-mother-sms-bridge.sh
          grep -Fq -- 'MOTHER_SMS_SETUP="/var/www/html/deltabotvps/scripts/install-mother-sms-bridge.sh"' delta.sh
          grep -Fq -- 'MOTHER_SMS_SETUP="/var/www/html/deltabotvps/scripts/install-mother-sms-bridge.sh"' update.sh
          grep -Fq -- '[ -f "/etc/delta-sms-bridge.php" ]' update.sh
          # No automatic invoices or child-bot changes within the bootstrapper.
          ! grep -Eq 'UPDATE[[:space:]]+pays|DELETE[[:space:]]+FROM[[:space:]]+pays|reseller_bots.*UPDATE' scripts/install-mother-sms-bridge.sh
          echo "Mother-only installer static guards PASS"
      - name: Reject child webhook and reseller domain before any clone or installation
        run: |
          sudo mkdir -p /var/www/html/deltabotvps
          printf '%s\n' '<?php $botUrl="https://mother.example.com/deltabotvps/"; $botToken="123456:exampleMotherBotTokenOnly"; $admin=12345; $dbName="motherdb";' | sudo tee /var/www/html/deltabotvps/baseInfo.php >/dev/null
          if sudo bash scripts/install-mother-sms-bridge.sh --domain reseller.example.com > /tmp/bridge-role-test.out 2>&1; then
            echo "FAIL: allowed a reseller domain"; exit 1
          fi
          grep -q 'Refusing cross-bot installation' /tmp/bridge-role-test.out
          printf '%s\n' '<?php $botUrl="https://mother.example.com/deltabotvps/bot.php?bid=7"; $botToken="123456:exampleChildBotToken"; $admin=12345; $dbName="childdb";' | sudo tee /var/www/html/deltabotvps/baseInfo.php >/dev/null
          if sudo bash scripts/install-mother-sms-bridge.sh --domain mother.example.com > /tmp/bridge-role-test.out 2>&1; then
            echo "FAIL: allowed a child webhook"; exit 1
          fi
          grep -q 'Not a verified mother' /tmp/bridge-role-test.out
          echo "Child and reseller isolation runtime tests PASS"
